name: Pull Request

on: [push, pull_request]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      workspace-name: ${{ github.sha }} # Unique workspace name using commit SHA
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Cache Go modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Save workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
          retention-days: 1

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Restore workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Build project
        run: go build ./...

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Restore workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Restore workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Run tests
        run: go test -v ./...
