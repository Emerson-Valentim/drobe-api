services:
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=drobe
      - S3_ENDPOINT=http://localstack:4566
      - S3_REGION=us-east-1
      - S3_BUCKET=clothes
    volumes:
      - .:/app  # Mount the current directory for hot reloading
    command: air  # Use air for hot reloading in development
    depends_on:
      - migrations
      - localstack

  migrations:
    build: 
      context: .
      dockerfile: cmd/migrations/Dockerfile
    command: ./main
    depends_on:
      - postgres
    networks:
      - drobe-network

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=dynamodb
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SERVICES=s3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/localstack:/etc/localstack/init/ready.d"
    networks:
      - drobe-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=drobe
    networks:
      - drobe-network

networks:
  drobe-network:
    driver: bridge
