openapi: 3.1.0
info:
  title: Drobe API
  description: API for managing clothing items in a digital wardrobe
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/clothes:
    get:
      summary: Get all clothes
      responses:
        '200':
          description: List of clothes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
    post:
      summary: Create a new clothing item
      responses:
        '200':
          description: Clothing item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /clothes/{id}:
    get:
      summary: Get a clothing item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clothing item retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
    put:
      summary: Update a clothing item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clothing item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
    delete:
      summary: Delete a clothing item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clothing item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
