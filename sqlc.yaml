version: "2"
sql:
  - engine: "postgresql"
    queries: "services/inventory/models"
    schema: "db/migrations/"
    gen:
      go:
        package: "models"
        out: "services/inventory/models"
        sql_package: "pgx/v5"

  - engine: "postgresql"
    queries: "services/auth/models"
    schema: "db/migrations/"
    gen:
      go:
        package: "models"
        out: "services/auth/models"
        sql_package: "pgx/v5"
